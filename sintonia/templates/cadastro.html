{% extends "base.html" %}

{% block title %}
Cadastro | Sintonia
{% endblock %}

{% block content %}

<section class="auth-card">

    <div class="brand">
        Criar usuário
    </div>

    <p class="subtitle">
        Cadastre sua conta para usar o Sintonia.
    </p>

    {% if erro %}
    <p class="error-message">
        {{ erro }}
    </p>
    {% endif %}

    <form
        method="POST"
        class="form"
    >

        <label for="nome">
            Nome
        </label>

        <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="name"
            required
        >

        <label for="usuario">
            Usuário
        </label>

        <input
            id="usuario"
            name="usuario"
            type="text"
            autocomplete="username"
            required
        >

        <label for="senha">
            Senha
        </label>

        <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="new-password"
            required
        >

        <label for="confirmar_senha">
            Confirmar senha
        </label>

        <input
            id="confirmar_senha"
            name="confirmar_senha"
            type="password"
            autocomplete="new-password"
            required
        >

        <button
            class="primary-button"
            type="submit"
        >
            Cadastrar
        </button>

    </form>

    <p class="switch-link">

        Já possui uma conta?

        <a href="{{ url_for('login') }}">
            Voltar para o login
        </a>

    </p>

</section>

{% endblock %}
