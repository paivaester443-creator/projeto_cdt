<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Sintonia{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <button
        type="button"
        class="theme-toggle"
        id="themeToggle"
    >
        <span id="themeIcon">
            Modo escuro
        </span>
    </button>

    <main class="page">

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% if mensagens %}

                <div class="flash-area">

                    {% for categoria, mensagem in mensagens %}

                        <div class="flash {{ categoria }}">
                            {{ mensagem }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}

        {% endwith %}


        {% block content %}
        {% endblock %}

    </main>


    <script
        src="{{ url_for('static', filename='app.js') }}"
    ></script>

</body>

</html>
