<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Sintonia</title>

    <style>

        :root {
            --fundo: #fff0f6;
            --card: #ffffff;
            --texto: #3d1f2f;
            --campo: #ffffff;
            --borda: #d98caf;
            --botao: #a83f6f;
            --botao-hover: #8d315c;
        }

        body.escuro {

            --fundo: #24131d;
            --card: #321923;
            --texto: #f9dce9;
            --campo: #29151f;
            --borda: #71334f;
            --botao: #9e416b;
            --botao-hover: #b94f7e;
        }

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--fundo);
            color: var(--texto);

            font-family: Arial, sans-serif;
        }

        .tema {

            position: fixed;
            top: 20px;
            right: 20px;

            padding: 10px 16px;

            border: 1px solid var(--borda);
            border-radius: 8px;

            background: var(--card);
            color: var(--texto);

            cursor: pointer;
        }

        .caixa {

            width: 400px;
            max-width: 90%;

            padding: 35px;

            border-radius: 16px;

            background: var(--card);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {

            display: block;

            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid var(--borda);
            border-radius: 8px;

            background: var(--campo);
            color: var(--texto);
        }

        button {

            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: var(--botao);
            color: white;

            cursor: pointer;
        }

        .erro {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 8px;

            background: #7d2947;
            color: white;

            text-align: center;
        }

        a {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--botao);
        }

    </style>

</head>

<body>

    <button
        class="tema"
        onclick="alternarTema()"
        id="botaoTema">
        Modo escuro
    </button>

    <div class="caixa">

        <h1>Criar conta</h1>

        {% if erro %}

            <div class="erro">
                {{ erro }}
            </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('cadastro') }}">

            <label>Usuário</label>

            <input
                type="text"
                name="usuario"
                required>

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                required>

            <label>Confirmar senha</label>

            <input
                type="password"
                name="confirmar_senha"
                required>

            <button type="submit">
                Criar conta
            </button>

        </form>

        <a href="{{ url_for('inicio') }}">
            Já tenho uma conta
        </a>

    </div>

    <script>

        function alternarTema() {

            document.body.classList.toggle("escuro");

            const escuro =
                document.body.classList.contains("escuro");

            localStorage.setItem(
                "temaSintonia",
                escuro ? "escuro" : "claro"
            );

            document.getElementById(
                "botaoTema"
            ).textContent =
                escuro
                    ? "Modo claro"
                    : "Modo escuro";
        }

        if (
            localStorage.getItem("temaSintonia")
            === "escuro"
        ) {

            document.body.classList.add("escuro");

            document.getElementById(
                "botaoTema"
            ).textContent = "Modo claro";
        }

    </script>

</body>

</html>
