<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Mood Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-sub: #cccccc;
            --input-bg: #2d2d2d;
            --border-color: #ff69b4; /* Rosa */
            --accent-green: #1db954; /* Verde */
            --accent-pink: #ff69b4;  /* Rosa */
        }

        .light-theme {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-color: #222222;
            --text-sub: #555555;
            --input-bg: #e0e0e0;
            --border-color: #ff69b4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .card { 
            background-color: var(--card-bg); 
            padding: 35px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 420px; 
            border: 3px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            box-shadow: 0 8px 24px rgba(255, 105, 180, 0.2); 
            position: relative;
        }

        .header-box { display: flex; justify-content: space-between; align-items: center; }
        .card h1 { color: var(--accent-pink); font-size: 1.6rem; }
        
        .theme-toggle { 
            background: var(--accent-green); 
            color: #000; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 0.8rem;
        }

        .control-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        label { font-size: 0.85rem; color: var(--accent-green); text-transform: uppercase; font-weight: bold; }
        
        select, input { 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            background-color: var(--input-bg); 
            color: var(--text-color); 
            outline: none; 
            font-size: 0.95rem; 
        }

        .btn-submit { 
            background-color: var(--accent-green); 
            color: #000; 
            font-weight: bold; 
            padding: 14px; 
            border-radius: 25px; 
            border: none; 
            cursor: pointer; 
            font-size: 1rem; 
            margin-top: 10px;
        }
        .btn-submit:hover { transform: scale(1.03); filter: brightness(1.1); }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-box">
            <h1>🎵 Mood Player</h1>
            <button class="theme-toggle" onclick="toggleTema()">🌓 Modos</button>
        </div>

        <p style="color: var(--text-sub); font-size: 0.88rem;">Crie playlists no Spotify unindo Clima, Humor e seu Artista favorito.</p>
        
        <div class="control-group">
            <label>Cidade (Clima)</label>
            <input type="text" id="cidade" value="Sao Paulo">
        </div>

        <div class="control-group">
            <label>Artista / Banda (Opcional)</label>
            <input type="text" id="artista" placeholder="Ex: Ateez, Twice, Coldplay">
        </div>

        <div class="control-group">
            <label>Seu Humor</label>
            <select id="humor">
                <option value="Feliz">Feliz</option>
                <option value="Triste">Triste</option>
                <option value="Energético">Energético</option>
                <option value="Calmo">Calmo</option>
                <option value="Romântico">Romântico</option>
                <option value="Nostálgico">Nostálgico</option>
            </select>
        </div>

        <button class="btn-submit" onclick="gerarPlaylistSpotify()">🚀 Gerar no Spotify</button>
    </div>

    <script>
        function toggleTema() {
            document.body.classList.toggle('light-theme');
        }

        function gerarPlaylistSpotify() {
            const cidade = document.getElementById('cidade').value;
            const artista = document.getElementById('artista').value;
            const humor = document.getElementById('humor').value;
            
            window.location.href = `/gerar?cidade=${encodeURIComponent(cidade)}&artista=${encodeURIComponent(artista)}&humor=${encodeURIComponent(humor)}`;
        }
    </script>
</body>
</html>
