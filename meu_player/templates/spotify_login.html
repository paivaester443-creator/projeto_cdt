<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spotify - Sintonia</title>

    <style>

        body {

            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #24131d;
            color: #f9dce9;

            font-family: Arial, sans-serif;
        }

        .caixa {

            width: 400px;
            max-width: 90%;

            padding: 35px;

            text-align: center;

            border-radius: 16px;

            background: #321923;
        }

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 25px;

            border-radius: 8px;

            background: #9e416b;
            color: white;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="caixa">

        <h1>Conectar ao Spotify</h1>

        <p>
            Para criar suas playlists,
            conecte sua conta do Spotify.
        </p>

        <a href="{{ url_for('spotify_login') }}">
            Entrar com Spotify
        </a>

    </div>

</body>

</html>
