<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acesso Root - Sintonia</title>

    <style>

        :root {

            --fundo: #fff0f6;
            --card: #ffffff;
            --texto: #3d1f2f;
            --campo: #ffffff;
            --borda: #d98caf;
            --botao: #a83f6f;
        }

        body.escuro {

            --fundo: #24131d;
            --card: #321923;
            --texto: #f9dce9;
            --campo: #29151f;
            --borda: #71334f;
            --botao: #9e416b;
        }

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--fundo);
            color: var(--texto);

            font-family: Arial, sans-serif;
        }

        .caixa {

            width: 400px;
            max-width: 90%;

            padding: 35px;

            border-radius: 16px;

            background: var(--card);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {

            display: block;

            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid var(--borda);
            border-radius: 8px;

            background: var(--campo);
            color: var(--texto);
        }

        button {

            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: var(--botao);
            color: white;

            cursor: pointer;
        }

        .erro {

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 8px;

            background: #7d2947;
            color: white;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="caixa">

        <h1>Acesso Root</h1>

        {% if erro %}

            <div class="erro">
                {{ erro }}
            </div>

        {% endif %}

        <form method="POST">

            <label>Usuário</label>

            <input
                type="text"
                name="usuario"
                required>

            <label>Senha</label>

            <input
                type="password"
                name="senha"
                required>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
